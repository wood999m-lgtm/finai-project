<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="../static/mywebscript.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Emotion Detector</h1>
        <textarea id="textToAnalyze" class="form-control mb-3" rows="4"
                  placeholder="Type a sentence in English..."></textarea>
        <button class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Emotion Analysis</button>
        <h4 class="mt-4">Result:</h4>
        <div id="system_response" class="alert alert-info"></div>
    </div>
</body>
</html>
